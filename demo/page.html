<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace Overview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #1a1b26; color: #c0caf5; font: 600 20px/1.4 "JetBrainsMono Nerd Font", monospace;
  }
  main { text-align: center; }
  h1 { font-size: 64px; margin: 0 0 32px; color: #7aa2f7; }
  .grid { display: grid; grid-template-columns: repeat(5, 120px); gap: 16px; justify-content: center; }
  .grid div { height: 76px; border: 3px solid #565f89; border-radius: 6px; }
  .grid .on { background: #7aa2f7; border-color: #7aa2f7; }
  .grid .full { background: #414868; }
  p { color: #9aa5ce; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Workspace Overview</h1>
  <div class="grid">
    <div class="full"></div><div class="on"></div><div class="full"></div><div class="full"></div><div></div>
    <div class="full"></div><div class="full"></div><div></div><div></div><div></div>
  </div>
  <p>A plugin for Omarchy</p>
</main>
</body>
</html>
